openapi: 3.0.3
info:
  title: Adax Integra API
  version: 1.0.0
  description: Backend API for Adax Integra.

servers:
  - url: http://localhost:3001
    description: Local development

tags:
  - name: Health
  - name: External Users
  - name: Internal Users

paths:
  /:
    get:
      tags: [Health]
      summary: Server status
      responses:
        '200':
          description: Server is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: server running

  /health:
    get:
      tags: [Health]
      summary: Health check
      description: Used by mobile clients and load balancers.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/external-users/{userId}/pre-submission:
    parameters:
      - $ref: '#/components/parameters/UserId'

    get:
      tags: [External Users]
      summary: Get pre-submission data
      description: >
        Returns profile, address, and documents for an external user.
        Each nested object has its own primary key:
        `profile.user_id`, `address.address_id`, and `documents.document_id`
        are different UUIDs.
        Document URL fields are signed links that expire after 15 minutes.
      responses:
        '200':
          description: Pre-submission data retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreSubmissionSuccessResponse'
              example:
                success: true
                data:
                  profile:
                    user_id: 11111111-1111-4111-8111-111111111111
                    name: Carmen
                    last_name: Taboada
                    email: carmen.taboada@gmail.com
                    birth_date: '1990-01-01'
                    phone: '+524161234567'
                  address:
                    address_id: 22222222-2222-4222-8222-222222222222
                    address_line_1: Av. Francisco Villa 123
                    address_line_2: Casa 123
                    neighborhood: San Juan de la Cruz
                    zip_code: '29900'
                    country: México
                    state: Querétaro
                    city: San Juan del Río
                  documents:
                    document_id: 33333333-3333-4333-8333-333333333333
                    identity_document_url: https://example.supabase.co/storage/v1/object/sign/user-documents/11111111-1111-4111-8111-111111111111/identity/ine.pdf?token=example
                    proof_of_address_url: https://example.supabase.co/storage/v1/object/sign/user-documents/11111111-1111-4111-8111-111111111111/address/comprobante_domicilio.pdf?token=example
        '400':
          description: Invalid request or user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags: [External Users]
      summary: Update pre-submission data
      description: >
        Partially updates profile, address, and/or documents.
        At least one of those sections must include a field.
        Document values are storage paths inside the `user-documents` bucket
        and must start with `{userId}/`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreSubmissionUpdateRequest'
            example:
              profile:
                name: Miranda
                last_name: Carrasco
                email: miranda.carrasco@yahoo.com
                birth_date: '1998-04-12'
                phone: '+5215512345678'
              address:
                address_line_1: Av. Reforma 123
                address_line_2: Casa 123
                neighborhood: San Juan de la Cruz
                zip_code: '06600'
                country: México
                state: Querétaro
                city: Jalpan de Serra
              documents:
                identity_document: 11111111-1111-4111-8111-111111111111/identity/ine.pdf
                proof_of_address: 11111111-1111-4111-8111-111111111111/address/comprobante_domicilio.pdf
      responses:
        '200':
          description: Pre-submission data updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreSubmissionSuccessResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/internal-users/{userId}/allCases:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Internal Users]
      summary: Get all cases from a specific user
      description: Returns an array of case summaries associated with the internal user.
      responses:
        '200':
          description: Successfully retrieved user cases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllCasesSuccessResponse'
        '400':
          description: Invalid request or missing userId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/external-users/register:
    post:
      tags: [External Users]
      summary: Create a new external user account (G-01)
      descriprion: >
        Creates an external user account with the password selected during
        registration. The password is hashed before storage and the external role
        is assigned automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
            example: 
              name: María
              last_name: Gómez
              email: maria.gomez@gmail.com
              country_code: '+52'
              phone: '5512345678'
              password: password123
              confirm_password: password123
      responses: 
        '201':
          description: External user account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAccountSuccessResponse'
        '400':
          description: Invalid registration information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: An account with this email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/internal-users/external-users:
    post:
      tags: [Internal Users]
      summary: Register a new external user's expediente (R-03)
      description: >
        A collaborator registers a new external user at first contact.
        Creates the user (with a temporary hashed password), assigns the
        external role, and creates the record (expediente) and address in a
        single transaction. Documents are not captured here. The temporary
        password is emailed to the external user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterExternalUserRequest'
            example:
              profile:
                name: María Fernanda
                last_name: Gómez Herrera
                email: mariafernanda.gomez@gmail.com
                birth_date: '1995-07-14'
                phone: '+525512345678'
              address:
                address_line_1: Av. Insurgentes Sur 1234
                address_line_2: Depto 5B
                neighborhood: Del Valle
                zip_code: '03100'
                country: México
                state: Ciudad de México
                city: Benito Juárez
      responses:
        '201':
          description: External user registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterExternalUserSuccessResponse'
              example:
                success: true
                data:
                  user_id: 4afc88b5-7956-47bf-9c30-d9e152bd8e9f
                  name: María Fernanda
                  last_name: Gómez Herrera
                  email: mariafernanda.gomez@gmail.com
                  birth_date: '1995-07-14'
                  phone: '+525512345678'
                  record_id: 673bd238-8c34-462e-b87e-4f5ec7f64863
                  address_id: fc84680f-f9ba-4a04-8f5c-1002a33ce735
        '400':
          description: Validation error or duplicate email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: External user UUID
      schema:
        type: string
        format: uuid
        example: 11111111-1111-4111-8111-111111111111

  schemas:
    Profile:
      type: object
      nullable: true
      description: User profile row. Primary key is `user_id`.
      properties:
        user_id:
          type: string
          format: uuid
          description: Primary key of the user/profile record. Not the same as address_id or document_id.
          example: 11111111-1111-4111-8111-111111111111
        name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        birth_date:
          type: string
          format: date
        phone:
          type: string

    Address:
      type: object
      nullable: true
      description: Address row linked to the user. Primary key is `address_id`.
      properties:
        address_id:
          type: string
          format: uuid
          description: Primary key of the address record. Different from user_id and document_id.
          example: 22222222-2222-4222-8222-222222222222
        address_line_1:
          type: string
        address_line_2:
          type: string
          nullable: true
        neighborhood:
          type: string
        zip_code:
          type: string
        country:
          type: string
        state:
          type: string
        city:
          type: string

    Documents:
      type: object
      nullable: true
      description: >
        Documents linked to the user. Primary key is `document_id`.
        File paths stay in storage and are not returned.
        URL fields are signed links that expire after 15 minutes.
      properties:
        document_id:
          type: string
          format: uuid
          description: Primary key of the documents record. Different from user_id and address_id.
          example: 33333333-3333-4333-8333-333333333333
        identity_document_url:
          type: string
          format: uri
          nullable: true
          description: >
            Signed read URL for the identity document. Null when no file is stored.
            Expires after 15 minutes. Response only; do not send this on update.
        proof_of_address_url:
          type: string
          format: uri
          nullable: true
          description: >
            Signed read URL for the proof of address. Null when no file is stored.
            Expires after 15 minutes. Response only; do not send this on update.

    PreSubmissionData:
      type: object
      description: >
        Nested objects each keep their own table primary key
        (`user_id`, `address_id`, `document_id`). Those three values are distinct.
      properties:
        profile:
          $ref: '#/components/schemas/Profile'
        address:
          $ref: '#/components/schemas/Address'
        documents:
          $ref: '#/components/schemas/Documents'

    ProfileUpdate:
      type: object
      properties:
        name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        birth_date:
          type: string
          format: date
          description: Must be YYYY-MM-DD
        phone:
          type: string

    AddressUpdate:
      type: object
      properties:
        address_line_1:
          type: string
        address_line_2:
          type: string
          nullable: true
        neighborhood:
          type: string
        zip_code:
          type: string
        country:
          type: string
        state:
          type: string
        city:
          type: string

    DocumentsUpdate:
      type: object
      properties:
        identity_document:
          type: string
          description: Storage path that must start with `{userId}/`
        proof_of_address:
          type: string
          description: Storage path that must start with `{userId}/`

    PreSubmissionUpdateRequest:
      type: object
      description: Provide at least one of profile, address, or documents.
      properties:
        profile:
          $ref: '#/components/schemas/ProfileUpdate'
        address:
          $ref: '#/components/schemas/AddressUpdate'
        documents:
          $ref: '#/components/schemas/DocumentsUpdate'

    PreSubmissionSuccessResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/PreSubmissionData'

    CaseSummary:
      type: object
      properties:
        caseId:
          type: string
          nullable: true
        writtenDescription:
          type: string
          nullable: true
        writtenHelpsWanted:
          type: string
          nullable: true
        hasLawyer:
          type: boolean
        state:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
        helps:
          type: array
          items:
            type: string
        violenceTypes:
          type: array
          items:
            type: string

    AllCasesSuccessResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/CaseSummary'

    CreateAccountRequest:
      type: object
      required: [name, last_name, email, country_code, phone, password, confirm_password]
      properties:
        name:
          type: string
        last_name:
          type: string
        email: 
          type: string
          format: email
        country_code:
          type: string
          pattern: '^\+\d{1,3}$'
        phone:
          type: string
          pattern: '^\d{10}$'
        password:
          type: string
          format: password
          minLength: 8
        confirm_password:
          type: string
          format: password
          minLength: 8

    CreateAccountData:
      type: object
      required: [userId, name, lastName, email, phone]
      properties:
        userId:
          type: string
          format: uuid
        name: 
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        phone: 
          type: string

    CreateAccountSuccessResponse:
      type: object
      required: [success, data]
      properties: 
        success: 
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/CreateAccountData'

    RegisterExternalUserProfile:
      type: object
      required: [name, last_name, email]
      properties:
        name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        birth_date:
          type: string
          format: date
          description: Optional. Must be YYYY-MM-DD.
        phone:
          type: string
          description: Optional.

    RegisterExternalUserAddress:
      type: object
      required: [address_line_1, neighborhood, zip_code, country, state, city]
      properties:
        address_line_1:
          type: string
        address_line_2:
          type: string
          nullable: true
        neighborhood:
          type: string
        zip_code:
          type: string
        country:
          type: string
        state:
          type: string
        city:
          type: string

    RegisterExternalUserRequest:
      type: object
      required: [profile, address]
      properties:
        profile:
          $ref: '#/components/schemas/RegisterExternalUserProfile'
        address:
          $ref: '#/components/schemas/RegisterExternalUserAddress'

    RegisterExternalUserData:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
        birth_date:
          type: string
          format: date
          nullable: true
        phone:
          type: string
          nullable: true
        record_id:
          type: string
          format: uuid
        address_id:
          type: string
          format: uuid

    RegisterExternalUserSuccessResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/RegisterExternalUserData'

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: userId parameter is required
