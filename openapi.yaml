    CreateEventRequest:
      type: object
      required: [title, startsAt, endsAt, modality, description]
      properties:
        title: { type: string, minLength: 1, maxLength: 150 }
        startsAt:
          type: string
          format: date-time
          description: Must include the time zone offset.
          example: '2026-11-03T10:00:00-06:00'
        endsAt:
          type: string
          format: date-time
          description: Must be after startsAt and include the time zone offset.
          example: '2026-11-03T11:30:00-06:00'
        modality: { type: string, enum: [Presencial, Virtual, Mixto] }
        location:
          type: string
          maxLength: 200
          nullable: true
          description: Required when modality is Presencial.
        link:
          type: string
          maxLength: 500
          nullable: true
          description: Must start with http:// or https://.
        phone:
          type: string
          nullable: true
          description: Country code followed by 10 digits.
          example: '+525512345678'
        description: { type: string, minLength: 1, maxLength: 2000 }
        notes: { type: string, maxLength: 1000, nullable: true }

    CreateEventData:
      type: object
      required: [eventId, title, startsAt, endsAt, modality, location, link, phone, description, notes]
      properties:
        eventId: { type: string, format: uuid }
        title: { type: string }
        startsAt: { type: string, format: date-time, description: UTC. }
        endsAt: { type: string, format: date-time, description: UTC. }
        modality: { type: string, enum: [Presencial, Virtual, Mixto] }
        location: { type: string, nullable: true }
        link: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        description: { type: string }
        notes: { type: string, nullable: true }

