openapi: 3.0.3
info:
  title: Adax Integra API
  version: 1.0.0
  description: Backend API for Adax Integra.

servers:
  - url: http://localhost:3001
    description: Local development
  - url: https://adax-integra.duckdns.org
    description: Server for testing

tags:
  - name: Health
  - name: Authentication
  - name: Password Recovery
  - name: Profile
  - name: Cases
  - name: External Users
  - name: Internal Users
  - name: Privacy Policy
  - name: Locations
  - name: Records
  - name: Reports
  - name: Events

paths:
  /:
    get:
      tags: [Health]
      summary: Get server status
      responses:
        '200':
          description: Server is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerStatusResponse'
              example: { status: server running }

  /health:
    get:
      tags: [Health]
      summary: Check service health
      description: Used by mobile clients and load balancers.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerStatusResponse'
              example: { status: ok }

  /.well-known/assetlinks.json:
    get:
      tags: [Health]
      summary: Android App Links verification
      description: Digital Asset Links file that lets Android open app links in the Adax Integra app instead of the browser.
      responses:
        '200':
          description: Asset links statement list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AssetLink' }

  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Log in a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: maria.gomez@gmail.com
              password: password123
      responses:
        '200':
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500': { $ref: '#/components/responses/InternalServerError' }
  /api/auth/logout:
    post:
      tags: [Authentication]
      summary: Log out the current session
      description: |
        Revokes the token sent in the Authorization header.
        Sessions on other devices remain active.
        No request body is required.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current session logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageSuccessResponse'
              example:
                success: true
                data:
                  message: Logged out successfully.
        '401':
          description: Token is missing, invalid, expired, or already revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unable to revoke the token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Unable to check whether the session is active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/change-password:
    post:
      tags: [Authentication]
      summary: Change the authenticated user's password
      description: Verifies the current password and stores a new password hash for the authenticated user.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              current_password: currentPassword123
              new_password: newPassword123
              confirm_password: newPassword123
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordSuccessResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Missing or invalid token, or current password is incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Authenticated user was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/password-recovery/forgot-password:
    post:
      tags: [Password Recovery]
      summary: Request a password recovery email
      description: If the email belongs to an account, a one-time recovery token valid for 1 hour is emailed to it. The response is the same whether the email exists or not.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
            example:
              email: maria.gomez@gmail.com
      responses:
        '200':
          description: Request processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageSuccessResponse'
              example:
                success: true
                data:
                  message: Si el correo existe, se envió un enlace
        '400':
          description: Email is missing or has an invalid format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: Favor de ingresar un correo válido.
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/password-recovery/reset-password:
    post:
      tags: [Password Recovery]
      summary: Reset the password with a recovery token
      description: Validates that the token exists, has not been used and has not expired, stores the new password hash and marks the token as used.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
            example:
              token: 9f2c1b7e4a...
              newPassword: newPassword123
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageSuccessResponse'
              example:
                success: true
                data:
                  message: Contraseña actualizada exitosamente.
        '400':
          description: Token is missing, not found, already used or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: Token ha expirado.
        '500':
          description: Internal server error. Also returned when newPassword has fewer than 8 characters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/profile/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Profile]
      summary: Get the authenticated user's profile (G-13)
      description: Returns the profile of the user in the token. The userId path parameter is currently ignored.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileSuccessResponse'
        '400':
          description: The user was not found or the query failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Profile]
      summary: Update the authenticated user's profile (R-04)
      description: |
        Updates the profile of the user in the token. The userId path parameter must match the token. At least one field is required and any field the role cannot edit is rejected.
        - **admin / internal**: name, last_name, phone
        - **external**: name, last_name, phone, country, state, municipality

        The response only confirms the update, use GET /api/profile/{userId}/edit to get the updated data.

        The email cannot be changed by any role.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            examples:
              staff:
                value:
                  name: Ana
                  phone: '+525512345678'
              external:
                value:
                  name: Ana
                  last_name: López
                  municipality: Monterrey
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageSuccessResponse'
              example:
                success: true
                data:
                  message: Profile updated successfully.
        '400':
          description: Invalid, empty or non-editable fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalProfileErrorResponse'
              example:
                success: false
                error: email cannot be modified
                errors:
                  email: email cannot be modified
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The userId does not match the token, or the user has no role that can edit a profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalProfileErrorResponse'
              example:
                success: false
                error: You do not have permission
        '404':
          description: The user, or the address of an external user, was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalProfileErrorResponse'
              example:
                success: false
                error: user not found
                errors: null

  /api/profile/{userId}/deactivate:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [Profile]
      summary: Deactivate the authenticated user's account (G-08)
      description: |
        An external or internal user deactivates her own account. The userId path parameter must match the token.
        The account is hidden with deleted_at instead of being deleted, so it can no longer log in and its records, cases and log entries are kept.
        Admin accounts cannot be deactivated. The action is saved in the activity log as deactivate_account.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Account deactivated
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    required: [userId, deactivatedAt]
                    properties:
                      userId: { type: string, format: uuid }
                      deactivatedAt: { type: string, format: date-time }
              example:
                success: true
                data:
                  userId: 0b7a1c1e-6f0a-4b55-9a4e-2f1d7f5c9a10
                  deactivatedAt: '2026-10-15T18:30:00.000Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The userId does not match the token, the account is an admin, or the user has no external or internal role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                success: false
                error: An admin account cannot be deactivated
        '409':
          description: The account is already deactivated or does not exist
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                success: false
                error: The account is already deactivated or does not exist.
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/profile/{userId}/edit:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Profile]
      summary: Get the profile fields the user can edit (R-04)
      description: |
        Returns the same fields PATCH /api/profile/{userId} can edit. The userId path parameter must match the token.
        External users also get their address, admin and internal users do not.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditableProfileSuccessResponse'
        '400':
          description: The query failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The userId does not match the token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: You do not have permission
        '404':
          description: The user was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/external-user/register:
    post:
      tags: [External Users]
      summary: Create an external user account by self-signup
      description: Creates an external account and hashes the selected password before storage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
            example:
              name: Maria
              last_name: Gomez
              email: maria.gomez@gmail.com
              password: password123
              confirm_password: password123
      responses:
        '201':
          description: External user account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAccountSuccessResponse'
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/external-users/{userId}/documents:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [External Users]
      summary: View own documents (R-06)
      description: |
        Allows an authenticated external user to see which of their
        documents are already uploaded. Same response as V-13, but only
        for the owner and without an activity log entry.

        Storage paths are never returned, only signed links to
        GET /api/documents/files/{token} that expire after 5 minutes and the
        kind of file. A document is null when it was not uploaded yet.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Documents retrieved (null when not uploaded yet)
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/RecordDocuments'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: The user is not an external user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500': { $ref: '#/components/responses/InternalServerError' }
    patch:
      tags: [External Users]
      summary: Upload or replace external user documents (R-06)
      description: |
        Allows an authenticated external user to upload or replace
        their own identity document or proof of address.

        At least one document must be provided.
        Documents not included in the request remain unchanged.

        Accepted formats: JPEG and PNG.
        Maximum file size: 5 MB per document.

        Replaced documents are removed from storage after
        the database update succeeds.

        Files are encrypted with AES-256-GCM before they are saved in
        storage. Returned document URLs are signed links to
        GET /api/documents/files/{token} and expire after 5 minutes.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              minProperties: 1
              properties:
                identity_document:
                  type: string
                  format: binary
                  description: Identity document. JPEG or PNG, max 5 MB.
                proof_of_address:
                  type: string
                  format: binary
                  description: Proof of address. JPEG or PNG, max 5 MB.
      responses:
        '200':
          description: Documents uploaded or replaced successfully
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Documents'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: User documents not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/documents/files/{token}:
    parameters:
      - in: path
        name: token
        required: true
        schema: { type: string }
        description: Signed link token from a document url (R-06 or V-13).
    get:
      tags: [External Users]
      summary: Download a document decrypted (R-06 / V-13)
      description: |
        Opens the url returned by the R-06 and V-13 document endpoints.
        Documents are stored encrypted (AES-256-GCM, one data key per
        file wrapped with DOCUMENTS_MASTER_KEY); this endpoint decrypts
        them and returns the original image.

        It does not use the session token: the link token is the
        permission. It expires after 5 minutes and stops working as soon
        as the document is replaced.
      security: []
      responses:
        '200':
          description: The decrypted document
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        '403':
          description: The link is invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: The link is invalid or expired.
        '404':
          description: The document was replaced or deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: Document not found.
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/records:
    get:
      tags: [Records]
      summary: List expedientes (records) for internal staff (V-05)
      description: Returns a paginated list of 10 expedientes per page. Supports search by the usuaria's name or folio, and filters by whether the record has open cases and by lifecycle status. Admin and internal users only.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
          description: Page number (10 records per page).
        - in: query
          name: search
          schema: { type: string }
          description: Matches the usuaria's name or the record folio (record_number).
        - in: query
          name: hasOpenCases
          schema: { type: boolean }
          description: When true, only records with open cases; when false, only records without open cases.
        - in: query
          name: status
          schema:
            type: string
            enum: [SIN_EMPEZAR, EN_REVISION, EN_SEGUIMIENTO, COMPLETADO]
          description: Filters by the record lifecycle status.
      responses:
        '200':
          description: Records retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordListSuccessResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  
  /api/external-users/{userId}/cases:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [External Users]
      summary: Create a case for an external user (R02)
      description: Register a new case in the user's active record
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCaseRequest'
      responses:
        '201':
          description: Case created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCaseSuccessResponse'
        '400':
          description: Invalid userId or request body. When the body is invalid, errors has the reason for each field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCaseErrorResponse'
              examples:
                invalidBody:
                  summary: Invalid body fields
                  value:
                    success: false
                    error: writtenDescription must be a non-empty string. hasExternalSupport must be true or false
                    errors:
                      writtenDescription: writtenDescription must be a non-empty string.
                      hasExternalSupport: hasExternalSupport must be true or false
                invalidUserId:
                  summary: Invalid userId
                  value:
                    success: false
                    error: userId must be a valid UUID
                    errors: null
        '404':
          description: The user has no active record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCaseErrorResponse'
              example:
                success: false
                error: Record not found for this user
                errors: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/internal-users:
    get:
      tags: [Internal Users]
      summary: List internal accounts (G-06)
      description: Admin only. Returns all users with the internal role, ordered by creation date (newest first). An account is active when it has not been deleted.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Internal accounts retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        user_id: { type: string, format: uuid }
                        name: { type: string, example: Ana }
                        last_name: { type: string, example: López }
                        email: { type: string, format: email, example: ana.lopez@example.com }
                        role: { type: string, example: internal }
                        is_active: { type: boolean, example: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }

    post:
      tags: [Internal Users]
      summary: Create a collaborator account (G-03)
      description: Admin only. Creates an internal user (collaborator). The email must not belong to any existing account. Validation errors include an "errors" object with one message per field.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCollaboratorRequest'
      responses:
        '201':
          description: Collaborator created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCollaboratorSuccessResponse'
        '400':
          description: Invalid or missing fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCollaboratorErrorResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: An account with this email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCollaboratorErrorResponse'
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/internal-users/activity-log:
    get:
      tags: [Internal Users]
      summary: List the activity log (V-06)
      description: Admin only. Returns 10 entries per page, newest first. Can be filtered by a date and time range. Each entry has who did the action, the action and when it happened. Validation errors include an "errors" object with one message per parameter.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
          description: Page number (10 entries per page).
        - in: query
          name: from
          schema: { type: string, format: date-time, example: '2026-10-04T00:00:00Z' }
          description: Only entries created at or after this date and time (ISO format with time zone).
        - in: query
          name: to
          schema: { type: string, format: date-time, example: '2026-10-04T23:59:59Z' }
          description: Only entries created at or before this date and time. Must be later than from.
      responses:
        '200':
          description: Activity log retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityLogSuccessResponse'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityLogErrorResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/internal-users/{userId}/allCases:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Internal Users]
      summary: Get all cases for a user (V-10)
      description: >
        Admin and internal users only. Returns the case cards of every case in
        the user's records. Each case includes urgency calculated from the
        highest severity among its active violence types: severity 8-10 is
        Alta, 4-7 is Media, 1-3 is Baja, and cases without a valid severity
        are Sin evaluar.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Cases retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseSummaryListResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        
  /api/internal-users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Internal Users]
      summary: Get the detail of a collaborator (G-10)
      description: Admin only. Returns the information of one internal account. Accounts that are not internal (admins and external users) return 404. An account is inactive when it has been deleted, and inactive collaborators can still be consulted. The role is the one stored in the database and the office is null when none was assigned.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Collaborator detail retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollaboratorDetailSuccessResponse'
        '400':
          description: userId is not a valid UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: userId must be a valid UUID
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: The user does not exist or is not an internal account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: Collaborator not found
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/internal-users/{userId}/assigned-cases:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Internal Users]
      summary: List the cases assigned to a collaborator (G-10)
      description: Admin only. Returns the case cards of the cases assigned to the collaborator, most recently updated first. Removed assignments are ignored. Cases of an inactive collaborator are still returned because they stay assigned until they are reassigned. The list has no pagination and returns at most 100 cases, and total is the number of cases returned. Accounts that are not internal return 404 instead of an empty list.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Assigned cases retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollaboratorCasesSuccessResponse'
        '400':
          description: userId is not a valid UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: userId must be a valid UUID
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: The user does not exist or is not an internal account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: Collaborator not found
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/internal-users/external-users:
    get:
      tags: [Internal Users]
      summary: List external accounts (G-16)
      description: Admin only. Returns 10 external accounts per page. By default only active accounts are returned, newest first. Can search by full name or email, filter by account status and order alphabetically. An account is inactive when it has been deleted. Validation errors include an "errors" object with one message per parameter.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
          description: Page number (10 accounts per page).
        - in: query
          name: search
          schema: { type: string, maxLength: 100 }
          description: Matches the full name or the email, without case sensitivity.
        - in: query
          name: status
          schema: { type: string, enum: [active, inactive, all], default: active }
          description: Filters by account status.
        - in: query
          name: sort
          schema: { type: string, enum: [recent, alphabetical], default: recent }
          description: recent orders by creation date (newest first). alphabetical orders by full name (A-Z).
      responses:
        '200':
          description: External accounts retrieved. An empty page returns users as an empty array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalUserListSuccessResponse'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalUserListErrorResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError'}

    post:
      tags: [Internal Users]
      summary: Register an external user's expediente (R-03)
      description: Creates the user, record, and address, then emails a temporary password. Admin and internal users only.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterExternalUserRequest'
      responses:
        '201':
          description: External user registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterExternalUserSuccessResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/internal-users/external-users/{userId}/cases:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Internal Users]
      summary: Create a case for an external user (R-11)
      description: >
        Admin and internal users only. Creates a case in the external user's
        active record. The request body uses the same fields as the external
        user's case creation flow.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCaseRequest'
      responses:
        '201':
          description: Case created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCaseSuccessResponse'
        '400':
          description: Invalid userId or request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCaseErrorResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: The user has no active record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCaseErrorResponse'
        '409':
          description: The user's record already has the maximum number of active cases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCaseErrorResponse'
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/internal-users/external-users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Internal Users]
      summary: Get the personal data of an external user (G-07)
      description: Returns the profile and address the admin reviews before editing them. Admin only. Accounts that are not external users return 404.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: External user data retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalProfileSuccessResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The caller is not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The user does not exist or is not an external user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: External user not found
        '500': { $ref: '#/components/responses/InternalServerError' }
    patch:
      tags: [Internal Users]
      summary: Update the text data of an external user (G-07)        
      description: Admin only. Only email, phone and address can change. name, last name and birth date are rejected. The change and its activity_log entry are saved in one transaction. The external user is notified by email, to the old and the new address when the email changes.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalProfileUpdateRequest'
            example:
              profile:
                phone: '+524424567890'
              address:
                municipality: Corregidora
              reason: La usuaria se mudó y cambió de número
              consentConfirmed: true
      responses:
        '200':
          description: External user data updated
          content:
            application/json:
              schema:
                $ref:  '#/components/schemas/ExternalProfileSuccessResponse'
        '400':
          description: Invalid userId, invalid body or no real changes. When the body is invalid, errors has the reason for each field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalProfileErrorResponse'
              examples:
                invalidBody:
                  summary: Invalid body fields
                  value:
                    success: false
                    error: profile.name cannot be modified consentConfirmed must be true
                    errors:
                      profile.name: profile.name cannot be modified
                      consentConfirmed: consentConfirmed must be true
                noChanges:
                  summary: Same values already Stored
                  value:
                    success: false
                    error: The submitted data has no changes
                    errors: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The caller is not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalProfileErrorResponse'
        '404':
          description: The user does not exist or is not an external user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalProfileErrorResponse'
              example:
                success: false
                error: External user not found
                errors: null
        '409':
          description: The new email already belongs to another account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalProfileErrorResponse'
              example:
                success: false
                error: This email is already registered
                errors: null
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/internal-users/external-users/{userId}/documents:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Internal Users]
      summary: View the documents of an external user's record (V-13)
      description: |
        Internal users and admins open the identity document (INE) and the
        proof of address that the external user uploaded in R-06.

        Storage paths are never returned, only signed links to
        GET /api/documents/files/{token} that expire after 5 minutes and the
        kind of file. Accounts that are not external users
        return 404. Each consultation is saved in the activity log as
        view_external_documents.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Documents retrieved (null when not uploaded yet)
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/RecordDocuments'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: The user does not exist or is not an external user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: External user not found
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/cases:
    get:
      tags: [Cases]
      summary: List cases
      description: Returns cases filtered by name or case ID and ordered by calculated urgency.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Urgency'
      responses:
        '200':
          description: Cases retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseListResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/cases/assigned:
    get:
      tags: [Cases]
      summary: List the cases assigned to the logged-in collaborator (V-12)
      description: Internal and admin only. The user comes from the token. Includes closed cases. Open cases come first, ordered by severity (highest first), then closed cases, most recently updated first.
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          description: all returns every case, open excludes closed cases, closed returns only closed cases.
          schema:
            type: string
            enum: [all, open, closed]
            default: all
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Urgency'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Assigned cases retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseListResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/cases/collaborators:
    get:
      tags: [Cases]
      summary: List the accounts that can be assigned to a case (R-10)
      description: Internal and admin only. Returns the active internal and admin accounts sorted by name, with only the data needed to pick one and send its userId to POST /api/cases/{caseId}/assignments. Deactivated accounts are not returned. The full collaborator list stays in GET /api/internal-users (G-06, admin only).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Assignable accounts retrieved. If there are none, data is an empty array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignableCollaboratorListResponse'
              example:
                success: true
                data:
                  - userId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                    name: Ana
                    lastName: López
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500':
          description: Unable to retrieve collaborators
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseAssignmentErrorResponse'
              example:
                success: false
                code: SERVER_ERROR
                error: Unable to retrieve collaborators.

  /api/violence-types:
    get:
      tags: [Cases]
      summary: List active violence types (R-07)
      description: Returns the active violence types sorted by name. Internal and admin only.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Violence types retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        violenceId:
                          type: string
                          format: uuid
                        description:
                          type: string
                          example: Física
                        severity:
                          type: integer
                          minimum: 1
                          maximum: 10
                          example: 8
        '401':
          description: Authentication required
        '403':
          description: Internal or admin role required
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/cases/{caseId}:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      tags: [Cases]
      summary: Get case details and progress (V-07)
      responses:
        '200':
          description: Case details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDetailResponse'
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/cases/{caseId}/close:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    patch:
      tags: [Cases]
      summary: Close a case (V-11)
      description: Sets the case state to Closed when it is not already closed. A missing case and an already closed case both return 409.
      responses:
        '200':
          description: Case closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloseCaseSuccessResponse'
              example:
                success: true
                data:
                  caseId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  state: Closed
                  updatedAt: '2026-09-30T18:00:00.000Z'
        '400':
          description: caseId is missing or is not a UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The case is already closed or does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: Case with ID 3fa85f64-5717-4562-b3fc-2c963f66afa6 is already closed or does not exist.
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/cases/{caseId}/assignments:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    post:
      tags: [Cases]
      summary: Assign an internal or admin user to a case (R-10)
      description: Assigns an active internal or admin account to an open case. GET /api/cases/collaborators lists the accounts that can be assigned. A case can have several collaborators. Assigning a user that is already assigned succeeds again, and a removed assignment is restored. The action is saved in the activity log. Internal and admin only.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignCaseCollaboratorRequest'
      responses:
        '200':
          description: Collaborator assigned to the case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignCaseCollaboratorSuccessResponse'
              example:
                success: true
        '400':
          description: caseId or userId is missing or is not a UUID (VALIDATION_ERROR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseAssignmentErrorResponse'
              example:
                success: false
                code: VALIDATION_ERROR
                error: userId must be a valid UUID
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: The case does not exist (CASE_NOT_FOUND) or the user is not an internal or admin account (COLLABORATOR_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseAssignmentErrorResponse'
              example:
                success: false
                code: COLLABORATOR_NOT_FOUND
                error: Collaborator with ID 7c9e6679-7425-40de-944b-e07fc1f90ae7 not found.
        '409':
          description: The case is closed (CASE_CLOSED) or the account is deactivated (COLLABORATOR_INACTIVE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseAssignmentErrorResponse'
              example:
                success: false
                code: CASE_CLOSED
                error: Case with ID 3fa85f64-5717-4562-b3fc-2c963f66afa6 is closed.
        '500':
          description: Unable to assign the collaborator
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseAssignmentErrorResponse'
              example:
                success: false
                code: SERVER_ERROR
                error: Unable to assign the collaborator.

  /api/help-types:
    get:
      tags: [Case helps]
      summary: List the help types catalog (R-08)
      description: Returns the active help types an internal user can assign to a case. Internal and admin only.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Help types catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpTypeListResponse'
        '401':
          description: Missing or invalid token
        '403':
          description: The user is not internal or admin
        '500':
          description: Unable to retrieve help types
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseHelpErrorResponse'

  /api/cases/{caseId}/helps:
    put:
      tags: [Case helps]
      summary: Assign the required helps to a case (R-08)
      description: Replaces the helps of a case with the given list. An empty list removes every help. Internal and admin only.
      security:
        - BearerAuth: []
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignCaseHelpsRequest'
      responses:
        '200':
          description: Helps assigned to the case
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignCaseHelpsSuccessResponse'
        '400':
          description: Invalid case id, invalid helpIds (VALIDATION_ERROR) or help types that do not exist (INVALID_HELP_TYPE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseHelpErrorResponse'
        '401':
          description: Missing or invalid token
        '403':
          description: The user is not internal or admin
        '404':
          description: Case not found (CASE_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseHelpErrorResponse'
        '409':
          description: The case is closed (CASE_CLOSED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseHelpErrorResponse'
        '500':
          description: Unable to assign case helps
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseHelpErrorResponse'

  /api/cases/{caseId}/violence-types:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    patch:
      tags: [Cases]
      summary: Assign violence types to a case (R-07)
      description: |
        Replaces the active violence types of an open case with the given list.
        An empty list removes every violence type. The urgency is not saved; it is
        calculated from the most severe violence type (8 to 10 Alta, 4 to 7 Media,
        1 to 3 Baja, none Sin evaluar). Internal and admin only.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [violenceIds]
              properties:
                violenceIds:
                  type: array
                  maxItems: 20
                  uniqueItems: true
                  items:
                    type: string
                    format: uuid
            example:
              violenceIds:
                - 3fa85f64-5717-4562-b3fc-2c963f66afa6
      responses:
        '200':
          description: Violence types assigned successfully
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      caseId: { type: string, format: uuid }
                      violenceIds:
                        type: array
                        items: { type: string, format: uuid }
                      urgency:
                        type: string
                        enum: [Alta, Media, Baja, Sin evaluar]
                        example: Alta
        '400':
          description: Invalid case id or violenceIds (VALIDATION_ERROR), or violence types that do not exist or are inactive (INVALID_VIOLENCE_TYPE)
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Case not found (CASE_NOT_FOUND)
        '409':
          description: The case is closed (CASE_CLOSED)
        '500':
          description: Unable to assign violence types (SERVER_ERROR)

  /api/users/{userId}/cases:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Cases]
      summary: Get case summaries for a user
      responses:
        '200':
          description: User cases retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseSummaryListResponse'
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/privacy-policy/current:
    get:
      tags: [Privacy Policy]
      summary: Get the privacy notice in force (V-02)
      description: Returns the newest notice that has not been soft deleted. The notice is a PDF and documentUrl is a public link to it. policyId and version must be sent back when the user accepts.
      responses:
        '200':
          description: Notice in force retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyPolicySuccessResponse'
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/privacy-policy/consent:
    get:
      tags: [Privacy Policy]
      summary: Check whether a user accepted the notice in force (V-02)
      description: Used on start-up to decide whether the privacy screen must be shown. The user is taken from the token. It answers against the notice currently in force so publishing a new version makes every user consent again.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Consent status retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentStatusSuccessResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [Privacy Policy]
      summary: Record that a user accepted the notice (V-02)
      description: The user is taken from the token. The server sets the version, the timestamp, the client IP, and is_accepted. Calling it again for the same user and notice returns the existing consent instead of creating a duplicate.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterConsentRequest'
            example:
              policyId: ee5d5ef6-e18c-4d20-81cc-6fb4106bff48
      responses:
        '201':
          description: Consent recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterConsentSuccessResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/countries-states:
    get:
      tags: [Locations]
      summary: List countries and their states
      description: Returns active countries with their active states, both ordered by Spanish name. Used to fill country and state dropdowns.
      responses:
        '200':
          description: Countries and states retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountriesWithStatesSuccessResponse'
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/reports/export:
    get:
      tags: [Reports]
      summary: Export a report as CSV
      description: Returns a CSV report for the requested date range. This endpoint is restricted to authenticated administrators.
      security:
        - BearerAuth: []
      parameters:
        - name: start-date
          in: query
          required: true
          description: Inclusive start date of the report range.
          schema:
            type: string
            format: date
            example: '2026-01-01'
        - name: end-date
          in: query
          required: true
          description: Inclusive end date of the report range. The range cannot exceed one year and cannot precede start-date.
          schema:
            type: string
            format: date
            example: '2026-05-01'
      responses:
        '200':
          description: CSV report generated successfully.
          headers:
            Content-Disposition:
              description: Download filename for the generated CSV.
              schema:
                type: string
                example: attachment; filename="report-2026-01-01-2026-05-01.csv"
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/events:
    post:
      tags: [Events]
      summary: Register an event (E-04)
      description: Only internal users and admins can register events. The server sets the eventId and the control dates, and any other field in the body is ignored. Dates must include the time zone offset and are returned in UTC. Each IP can register up to 20 events per hour.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
            example:
              title: Reunión de equipo
              startsAt: '2026-11-03T10:00:00-06:00'
              endsAt: '2026-11-03T11:30:00-06:00'
              modality: Presencial
              location: Oficinas ADAX
              description: Revisión semanal de avance de casos activos
      responses:
        '201':
          description: Event registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEventSuccessResponse'
        '400':
          description: Invalid request body. errors has the reason for each field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEventErrorResponse'
              example:
                success: false
                error: location is required when modality is Presencial
                errors:
                  location: location is required when modality is Presencial
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429':
          description: More than 20 events registered from the same IP in one hour.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/events/{eventId}/disable:
    parameters:
      - $ref: '#/components/parameters/EventId'
    patch:
      tags: [Events]
      summary: Disable an event (E-03)
      description: Only internal users and admins can disable events. The event is hidden with deleted_at instead of being deleted. A missing event and an already disabled event both return 409.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Event disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisableEventSuccessResponse'
              example:
                success: true
                data:
                  eventId: 9bd51c3f-bb56-49ec-8911-3f8209a3b5ce
                  disabledAt: '2026-10-14T23:28:05.432'
        '400':
          description: eventId is not a UUID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                success: false
                error: eventId must be a valid UUID
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The event is already disabled or does not exist
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                success: false
                error: The event is already disabled or does not exist.
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/EventId'
    put:
      tags: [Events]
      summary: Update an event (E-02)
      description: Only internal users and admins can update events. The whole event is sent and follows the same rules as registering it, so a field left out is cleared. Any other field in the body is ignored. Dates must include the time zone offset and are returned in UTC. A missing event and a disabled event both return 404.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
            example:
              title: Reunión de equipo
              startsAt: '2026-11-03T10:00:00-06:00'
              endsAt: '2026-11-03T12:00:00-06:00'
              modality: Virtual
              link: https://meet.google.com/abc
              description: Revisión semanal de avance de casos activos
      responses:
        '200':
          description: Event updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEventSuccessResponse'
              example:
                success: true
                data:
                  eventId: 9bd51c3f-bb56-49ec-8911-3f8209a3b5ce
                  title: Reunión de equipo
                  startsAt: '2026-11-03T16:00:00+00:00'
                  endsAt: '2026-11-03T18:00:00+00:00'
                  modality: Virtual
                  location: null
                  link: https://meet.google.com/abc
                  phone: null
                  description: Revisión semanal de avance de casos activos
                  notes: null
        '400':
          description: eventId is not a UUID or the body is invalid. errors has the reason for each field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEventErrorResponse'
              example:
                success: false
                error: endsAt must be after startsAt
                errors:
                  endsAt: endsAt must be after startsAt
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: The event does not exist or is disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                success: false
                error: The event does not exist or is disabled.
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/events/{eventId}/image:
    parameters:
      - $ref: '#/components/parameters/EventId'
    patch:
      tags: [Events]
      summary: Upload or replace the event image (E-04)
      description: Only internal users and admins can upload the image of an active event. The file must be a JPEG or PNG of up to 5 MB, and its first bytes are checked so a renamed file is rejected. Uploading again replaces the previous image and deletes it from storage.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: JPEG or PNG, max 5 MB.
      responses:
        '200':
          description: Image saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadEventImageSuccessResponse'
              example:
                success: true
                data:
                  eventId: 1351c12d-a9ca-460b-851a-4e9a8f7bf495
                  imageUrl: https://xtuuspwioiflfofbhsps.supabase.co/storage/v1/object/public/event-images/1351c12d-a9ca-460b-851a-4e9a8f7bf495/3a5166dd-1ac7-4be1-970d-2ebf569040fe.png
        '400':
          description: eventId is not a UUID, the image is missing, is not a JPEG or PNG, or exceeds 5 MB
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                success: false
                error: 'image: only JPEG or PNG allowed.'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: The event does not exist or is disabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                success: false
                error: Event not found.
        '500': { $ref: '#/components/responses/InternalServerError' }

components:
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: User UUID
      schema: { type: string, format: uuid }
    CaseId:
      name: caseId
      in: path
      required: true
      description: Case UUID
      schema: { type: string, format: uuid }
    EventId:
      name: eventId
      in: path
      required: true
      description: Event UUID
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      description: One-based page number.
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      description: Number of cases per page.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Search:
      name: search
      in: query
      description: Case ID or user name search text.
      schema: { type: string, default: '' }
    Urgency:
      name: urgency
      in: query
      description: Urgency filter. Empty and Todas return all urgency levels.
      schema:
        type: string
        enum: ['', Todas, Alta, Media, Baja, Sin evaluar]
        default: ''
  
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer 
      bearerFormat: JWT
      description: |
        Token returned after authentication. Access requires a valid,
        unexpired JWT whose hash remains registered in the database.
        Logging out revokes only the token used for that request.

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing, invalid or expired token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: The caller does not have permission to access this resource.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    ServerStatusResponse:
      type: object
      required: [status]
      properties: { status: { type: string } }

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, example: false }
        error: { type: string }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    LoginData:
      type: object
      required: [token, user_id]
      properties:
        token: { type: string }
        user_id: { type: string, format: uuid }

    LoginSuccessResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/LoginData' }

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password, confirm_password]
      properties:
        current_password: { type: string, format: password }
        new_password: { type: string, format: password, minLength: 8 }
        confirm_password: { type: string, format: password, minLength: 8 }

    ChangePasswordSuccessResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [message]
          properties:
            message: { type: string, example: Password updated successfully. }

    AssetLink:
      type: object
      properties:
        relation:
          type: array
          items: { type: string, example: delegate_permission/common.handle_all_urls }
        target:
          type: object
          properties:
            namespace: { type: string, example: android_app }
            package_name: { type: string, example: com.example.adaxintegra }
            sha256_cert_fingerprints:
              type: array
              items: { type: string }

    MessageSuccessResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [message]
          properties:
            message: { type: string }

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string, description: Recovery token received by email. }
        newPassword: { type: string, format: password, minLength: 8 }

    UserProfile:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        birth_date: { type: string, format: date, nullable: true }
        phone: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    UserProfileSuccessResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/UserProfile' }

    EditableProfile:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        name: { type: string }
        last_name: { type: string }
        phone: { type: string, nullable: true }
        address:
          type: object
          nullable: true
          description: Only present for external users, with the same fields PATCH /api/profile/{userId} can edit
          properties:
            country: { type: string }
            state: { type: string }
            municipality: { type: string }

    EditableProfileSuccessResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/EditableProfile' }

    UpdateProfileRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      description: Allowed fields depend on the role, see PATCH /api/profile/{userId}
      properties:
        name: { type: string, description: Cannot be blank }
        last_name: { type: string, description: Cannot be blank }
        phone:
          type: string
          example: '+525512345678'
          description: Country code with + followed by 10 digits
        country: { type: string, description: external only }
        state: { type: string, description: external only }
        municipality: { type: string, description: external only }

    Address:
      type: object
      nullable: true
      properties:
        address_line_1: { type: string }
        address_line_2: { type: string, nullable: true }
        neighborhood: { type: string }
        zip_code: { type: string }
        country: { type: string }
        state: { type: string }
        city: { type: string }

    Documents:
      type: object
      nullable: true
      properties:
        document_id: { type: string, format: uuid }
        identity_document_url:
          type: string
          format: uri
          nullable: true
          description: Signed link to GET /api/documents/files/{token}, expires after 5 minutes.
        proof_of_address_url:
          type: string
          format: uri
          nullable: true
          description: Signed URL that expires after 15 minutes.

    RecordDocument:
      type: object
      nullable: true
      description: Null when the external user has not uploaded this document.
      required: [url, file_type]
      properties:
        url:
          type: string
          format: uri
          nullable: true
          description: Signed link to GET /api/documents/files/{token}, expires after 5 minutes. Null when the link could not be created.
        file_type:
          type: string
          enum: [pdf, image]

    RecordDocuments:
      type: object
      required: [user_id, identity_document, proof_of_address]
      properties:
        user_id: { type: string, format: uuid }
        identity_document:
          $ref: '#/components/schemas/RecordDocument'
        proof_of_address:
          $ref: '#/components/schemas/RecordDocument'

    AddressUpdate:
      type: object
      properties:
        address_line_1: { type: string }
        address_line_2: { type: string, nullable: true }
        neighborhood: { type: string }
        zip_code: { type: string }
        country: { type: string }
        state: { type: string }
        city: { type: string }

    CreateAccountRequest:
      type: object
      required: [name, last_name, email, password, confirm_password]
      properties:
        name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        confirm_password: { type: string, format: password, minLength: 8 }

    CreateAccountData:
      type: object
      required: [userId, name, lastName, email]
      properties:
        userId: { type: string, format: uuid }
        name: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }

    CreateAccountSuccessResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/CreateAccountData' }

    RegisterExternalUserProfile:
      type: object
      required: [name, last_name, email]
      properties:
        name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        birth_date: { type: string, format: date }
        phone: { type: string }

    RegisterExternalUserAddress:
      type: object
      required: [address_line_1, neighborhood, zip_code, country, state, city]
      properties:
        address_line_1: { type: string }
        address_line_2: { type: string, nullable: true }
        neighborhood: { type: string }
        zip_code: { type: string }
        country: { type: string }
        state: { type: string }
        city: { type: string }

    RegisterExternalUserRequest:
      type: object
      required: [profile, address]
      properties:
        profile: { $ref: '#/components/schemas/RegisterExternalUserProfile' }
        address: { $ref: '#/components/schemas/RegisterExternalUserAddress' }

    RegisterExternalUserData:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        birth_date: { type: string, format: date, nullable: true }
        phone: { type: string, nullable: true }
        record_id: { type: string, format: uuid }
        record_number: { type: string, example: EXP-2026-0001, nullable: true }
        address_id: { type: string, format: uuid }

    RegisterExternalUserSuccessResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/RegisterExternalUserData' }
    
    ExternalProfile:
      type: object
      nullable: true
      properties:
        name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        birth_date: { type: string, format: date, nullable: true }
        phone: { type: string, nullable: true }
    
    ExternalProfileAddress:
      type: object
      nullable: true
      properties:
        country: { type: string, example: México }
        state: { type: string, example: Querétaro }
        municipality: { type: string, example: Corregidora }
    
    ExternalProfileAddressUpdate:
      type: object
      description: Only the fields that change. Each one must be a non-empty string.
      properties:
        country: { type: string }
        state: { type: string }
        municipality: { type: string }

    ExternalProfileData:
      type: object
      required: [user_id, profile, address]
      properties:
        user_id: { type: string, format: uuid }
        profile: { $ref: '#/components/schemas/ExternalProfile' }
        address: { $ref: '#/components/schemas/ExternalProfileAddress' }
    
    ExternalProfileSuccessResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/ExternalProfileData' }
    
    ExternalProfileUpdateRequest:
      type: object
      required: [reason, consentConfirmed]
      description: At least one profile or address field is required. name, last_name and birth_date are rejected.
      properties:
        profile:
          type: object
          properties:
            email: { type: string, format: email }
            phone:
              type: string
              description: Country code followed by 10 digits, for example +524424567890.
        address: { $ref: '#/components/schemas/ExternalProfileAddressUpdate' }
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Why the data is being changed. Stored in the activity log.
        consentConfirmed:
          type: boolean
          enum: [true]
          description: The admin confirms the external user agreed to the change. Must be true.

    ExternalProfileErrorResponse:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, example: false }
        error: { type: string }
        errors:
          type: object
          nullable: true
          additionalProperties: { type: string }
          description: Reason for each invalid body field

    RecordListItem:
      type: object
      properties:
        record_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        name: { type: string, example: Daniela Alejandra Herrera Ocampo }
        record_number: { type: string, nullable: true, example: EXP-2026-0001 }
        status:
          type: string
          enum: [SIN_EMPEZAR, EN_REVISION, EN_SEGUIMIENTO, COMPLETADO]
          example: SIN_EMPEZAR
        active_cases_count: { type: integer, example: 2 }
        updated_at: { type: string, format: date-time, nullable: true }

    RecordListSuccessResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            records:
              type: array
              items: { $ref: '#/components/schemas/RecordListItem' }
            total: { type: integer, example: 42 }
            page: { type: integer, example: 1 }
            limit: { type: integer, example: 10 }

    CaseListItem:
      type: object
      properties:
        case_id: { type: string, format: uuid }
        name: { type: string }
        violence_types:
          type: array
          items: { type: string }
        state: { type: string, nullable: true }
        severity: { type: integer, nullable: true, minimum: 1, maximum: 10 }
        urgency:
          type: string
          enum: [Alta, Media, Baja, Sin evaluar]
          description: >
            Calculated from the highest active violence severity: 8-10 is
            Alta, 4-7 is Media, 1-3 is Baja, and no valid severity is
            Sin evaluar.
        updated_at: { type: string, format: date-time, nullable: true }

    CaseListData:
      type: object
      required: [cases, total, page, limit]
      properties:
        cases:
          type: array
          items: { $ref: '#/components/schemas/CaseListItem' }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 100 }

    CaseListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/CaseListData' }

    CaseSummary:
      type: object
      required: [caseId, caseNumber, state, userName, violenceTypes, assignedUsers, urgency, updatedAt]
      properties:
        caseId: { type: string, format: uuid, nullable: true }
        caseNumber: { type: string, nullable: true, example: C-26-9999 }
        state: { type: string, nullable: true, example: Open }
        userName:
          type: string
          nullable: true
          example: Maria Gomez
          description: Full name of the case owner.
        violenceTypes:
          type: array
          items: { type: string }
          description: Unique, non-deleted violence types.
        assignedUsers:
          type: array
          description: Internal users assigned to the case.
          items:
            type: object
            properties:
              userId: { type: string, format: uuid }
              name: { type: string, example: Mariana Robles Ortega }
        urgency:
          type: string
          enum: [Alta, Media, Baja, Sin evaluar]
          description: >
            Calculated from the highest active violence severity: 8-10 is
            Alta, 4-7 is Media, 1-3 is Baja, and no valid severity is
            Sin evaluar.
