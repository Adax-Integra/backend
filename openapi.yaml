openapi: 3.0.3
info:
  title: Adax Integra API
  version: 1.0.0
  description: Backend API for Adax Integra.

servers:
  - url: http://localhost:3001
    description: Local development
  - url: https://adax-integra.duckdns.org
    description: Server for testing

tags:
  - name: Health
  - name: Authentication
  - name: Password Recovery
  - name: Profile
  - name: Cases
  - name: External Users
  - name: Internal Users
  - name: Privacy Policy
  - name: Locations
  - name: Records
  - name: Reports

paths:
  /:
    get:
      tags: [Health]
      summary: Get server status
      responses:
        '200':
          description: Server is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerStatusResponse'
              example: { status: server running }

  /health:
    get:
      tags: [Health]
      summary: Check service health
      description: Used by mobile clients and load balancers.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerStatusResponse'
              example: { status: ok }

  /.well-known/assetlinks.json:
    get:
      tags: [Health]
      summary: Android App Links verification
      description: Digital Asset Links file that lets Android open app links in the Adax Integra app instead of the browser.
      responses:
        '200':
          description: Asset links statement list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AssetLink' }

  /api/auth/login:
    post:
      tags: [Authentication]
      summary: Log in a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: maria.gomez@gmail.com
              password: password123
      responses:
        '200':
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/auth/change-password:
    post:
      tags: [Authentication]
      summary: Change the authenticated user's password
      description: Verifies the current password and stores a new password hash for the authenticated user.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              current_password: currentPassword123
              new_password: newPassword123
              confirm_password: newPassword123
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordSuccessResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Missing or invalid token, or current password is incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Authenticated user was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/password-recovery/forgot-password:
    post:
      tags: [Password Recovery]
      summary: Request a password recovery email
      description: If the email belongs to an account, a one-time recovery token valid for 1 hour is emailed to it. The response is the same whether the email exists or not.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
            example:
              email: maria.gomez@gmail.com
      responses:
        '200':
          description: Request processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageSuccessResponse'
              example:
                success: true
                data:
                  message: Si el correo existe, se envió un enlace
        '400':
          description: Email is missing or has an invalid format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: Favor de ingresar un correo válido.
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/password-recovery/reset-password:
    post:
      tags: [Password Recovery]
      summary: Reset the password with a recovery token
      description: Validates that the token exists, has not been used and has not expired, stores the new password hash and marks the token as used.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
            example:
              token: 9f2c1b7e4a...
              newPassword: newPassword123
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageSuccessResponse'
              example:
                success: true
                data:
                  message: Contraseña actualizada exitosamente.
        '400':
          description: Token is missing, not found, already used or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: Token ha expirado.
        '500':
          description: Internal server error. Also returned when newPassword has fewer than 8 characters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/profile/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Profile]
      summary: Get the authenticated user's profile (G-13)
      description: Returns the profile of the user in the token. The userId path parameter is currently ignored.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileSuccessResponse'
        '400':
          description: The user was not found or the query failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/external-user/register:
    post:
      tags: [External Users]
      summary: Create an external user account by self-signup
      description: Creates an external account and hashes the selected password before storage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
            example:
              name: Maria
              last_name: Gomez
              email: maria.gomez@gmail.com
              password: password123
              confirm_password: password123
      responses:
        '201':
          description: External user account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAccountSuccessResponse'
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/external-users/{userId}/pre-submission:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [External Users]
      summary: Get external user pre-submission data
      description: Returns the user's profile (name, last name, birth date, phone), full address, and documents. Document URLs are signed links. Only the owner of this userId may call it.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Pre-submission data retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreSubmissionSuccessResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [External Users]
      summary: Update external user pre-submission data
      description: |
        At least one field in profile, address, or documents is required. Only the owner of this userId may call it.

        Two request formats are accepted:
        - **multipart/form-data**: upload the documents as files (PDF, JPEG or PNG, max 5 MB each). Files are stored under "{userId}/identity/" or "{userId}/address/" and replace any path sent for the same document. profile and address must be sent as JSON strings.
        - **application/json**: document values are storage paths that start with the user ID, contain no empty, ".", or ".." segments, and must already exist in storage.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PreSubmissionMultipartRequest'
            encoding:
              profile: { contentType: application/json }
              address: { contentType: application/json }
              identity_document: { contentType: 'application/pdf, image/jpeg, image/png' }
              proof_of_address: { contentType: 'application/pdf, image/jpeg, image/png' }
          application/json:
            schema:
              $ref: '#/components/schemas/PreSubmissionUpdateRequest'
      responses:
        '200':
          description: Pre-submission data updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreSubmissionSuccessResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/external-users/{userId}/documents:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [External Users]
      summary: Upload or replace external user documents (R-06)
      description: |
        Allows an authenticated external user to upload or replace
        their own identity document or proof of address.

        At least one document must be provided.
        Documents not included in the request remain unchanged.

        Accepted formats: PDF, JPEG and PNG.
        Maximum file size: 5 MB per document.

        Replaced documents are removed from storage after
        the database update succeeds.

        Returned document URLs are signed and expire after 15 minutes.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              minProperties: 1
              properties:
                identity_document:
                  type: string
                  format: binary
                  description: Identity document. PDF, JPEG or PNG, max 5 MB.
                proof_of_address:
                  type: string
                  format: binary
                  description: Proof of address. PDF, JPEG or PNG, max 5 MB.
      responses:
        '200':
          description: Documents uploaded or replaced successfully
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, example: true }
                  data:
                    $ref: '#/components/schemas/Documents'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: User documents not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500': { $ref: '#/components/responses/InternalServerError' }


  /api/records:
    get:
      tags: [Records]
      summary: List expedientes (records) for internal staff (V-05)
      description: Returns a paginated list of 10 expedientes per page. Supports search by the usuaria's name or folio, and filters by whether the record has open cases and by lifecycle status. Admin and internal users only.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
          description: Page number (10 records per page).
        - in: query
          name: search
          schema: { type: string }
          description: Matches the usuaria's name or the record folio (record_number).
        - in: query
          name: hasOpenCases
          schema: { type: boolean }
          description: When true, only records with open cases; when false, only records without open cases.
        - in: query
          name: status
          schema:
            type: string
            enum: [SIN_EMPEZAR, EN_REVISION, EN_SEGUIMIENTO, COMPLETADO]
          description: Filters by the record lifecycle status.
      responses:
        '200':
          description: Records retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordListSuccessResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  
  /api/external-users/{userId}/cases:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [External Users]
      summary: Create a case for an external user (R02)
      description: Register a new case in the user's active record
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCaseRequest'
      responses:
        '201':
          description: Case created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCaseSuccessResponse'
        '400':
          description: Invalid userId or request body. When the body is invalid, errors has the reason for each field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCaseErrorResponse'
              examples:
                invalidBody:
                  summary: Invalid body fields
                  value:
                    success: false
                    error: writtenDescription must be a non-empty string. hasExternalSupport must be true or false
                    errors:
                      writtenDescription: writtenDescription must be a non-empty string.
                      hasExternalSupport: hasExternalSupport must be true or false
                invalidUserId:
                  summary: Invalid userId
                  value:
                    success: false
                    error: userId must be a valid UUID
                    errors: null
        '404':
          description: The user has no active record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCaseErrorResponse'
              example:
                success: false
                error: Record not found for this user
                errors: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/internal-users:
    get:
      tags: [Internal Users]
      summary: List internal accounts (G-06)
      description: Admin only. Returns all users with the internal role, ordered by creation date (newest first). An account is active when it has not been deleted.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Internal accounts retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        user_id: { type: string, format: uuid }
                        name: { type: string, example: Ana }
                        last_name: { type: string, example: López }
                        email: { type: string, format: email, example: ana.lopez@example.com }
                        role: { type: string, example: internal }
                        is_active: { type: boolean, example: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }

    post:
      tags: [Internal Users]
      summary: Create a collaborator account (G-03)
      description: Admin only. Creates an internal user (collaborator). The email must not belong to any existing account. Validation errors include an "errors" object with one message per field.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCollaboratorRequest'
      responses:
        '201':
          description: Collaborator created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCollaboratorSuccessResponse'
        '400':
          description: Invalid or missing fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCollaboratorErrorResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: An account with this email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCollaboratorErrorResponse'
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/internal-users/activity-log:
    get:
      tags: [Internal Users]
      summary: List the activity log (V-06)
      description: Admin only. Returns 10 entries per page, newest first. Can be filtered by a date and time range. Each entry has who did the action, the action and when it happened. Validation errors include an "errors" object with one message per parameter.
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
          description: Page number (10 entries per page).
        - in: query
          name: from
          schema: { type: string, format: date-time, example: '2026-10-04T00:00:00Z' }
          description: Only entries created at or after this date and time (ISO format with time zone).
        - in: query
          name: to
          schema: { type: string, format: date-time, example: '2026-10-04T23:59:59Z' }
          description: Only entries created at or before this date and time. Must be later than from.
      responses:
        '200':
          description: Activity log retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityLogSuccessResponse'
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityLogErrorResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/internal-users/{userId}/allCases:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Internal Users]
      summary: Get all cases for a user (V-10)
      description: Admin and internal users only. Returns the case cards of every case in the user's records.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Cases retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseSummaryListResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/internal-users/external-users:
    post:
      tags: [Internal Users]
      summary: Register an external user's expediente (R-03)
      description: Creates the user, record, and address, then emails a temporary password. Admin and internal users only.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterExternalUserRequest'
      responses:
        '201':
          description: External user registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterExternalUserSuccessResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/internal-users/external-users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Internal Users]
      summary: Get the personal data of an external user (G-07)
      description: Returns the profile and address the admin reviews before editing them. Admin only. Accounts that are not external users return 404.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: External user data retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalProfileSuccessResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The caller is not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The user does not exist or is not an external user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: External user not found
        '500': { $ref: '#/components/responses/InternalServerError' }
    patch:
      tags: [Internal Users]
      summary: Update the text data of an external user (G-07)        
      description: Admin only. Only email, phone and address can change. name, last name and birth date are rejected. The change and its activity_log entry are saved in one transaction. The external user is notified by email, to the old and the new address when the email changes.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalProfileUpdateRequest'
            example:
              profile:
                phone: '+524424567890'
              address:
                neighborhood: Jurica
              reason: La usuaria se mudó y cambió de número
              consentConfirmed: true
      responses:
        '200':
          description: External user data updated
          content:
            application/json:
              schema:
                $ref:  '#/components/schemas/ExternalProfileSuccessResponse'
        '400':
          description: Invalid userId, invalid body or no real changes. When the body is invalid, errors has the reason for each field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalProfileErrorResponse'
              examples:
                invalidBody:
                  summary: Invalid body fields
                  value:
                    success: false
                    error: profile.name cannot be modified consentConfirmed must be true
                    errors:
                      profile.name: profile.name cannot be modified
                      consentConfirmed: consentConfirmed must be true
                noChanges:
                  summary: Same values already Stored
                  value:
                    success: false
                    error: The submitted data has no changes
                    errors: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: The caller is not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalProfileErrorResponse'
        '404':
          description: The user does not exist or is not an external user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalProfileErrorResponse'
              example:
                success: false
                error: External user not found
                errors: null
        '409':
          description: The new email already belongs to another account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalProfileErrorResponse'
              example:
                success: false
                error: This email is already registered
                errors: null
        '500': { $ref: '#/components/responses/InternalServerError' } 

  /api/cases:
    get:
      tags: [Cases]
      summary: List cases
      description: Returns cases filtered by name or case ID and ordered by calculated urgency.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Urgency'
      responses:
        '200':
          description: Cases retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseListResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/cases/{caseId}:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    get:
      tags: [Cases]
      summary: Get case details and progress (V-07)
      responses:
        '200':
          description: Case details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDetailResponse'
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/cases/{caseId}/close:
    parameters:
      - $ref: '#/components/parameters/CaseId'
    patch:
      tags: [Cases]
      summary: Close a case (V-11)
      description: Sets the case state to Closed when it is not already closed. A missing case and an already closed case both return 409.
      responses:
        '200':
          description: Case closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloseCaseSuccessResponse'
              example:
                success: true
                data:
                  caseId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  state: Closed
                  updatedAt: '2026-09-30T18:00:00.000Z'
        '400':
          description: caseId is missing or is not a UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The case is already closed or does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: Case with ID 3fa85f64-5717-4562-b3fc-2c963f66afa6 is already closed or does not exist.
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/users/{userId}/cases:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Cases]
      summary: Get case summaries for a user
      responses:
        '200':
          description: User cases retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseSummaryListResponse'
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/privacy-policy/current:
    get:
      tags: [Privacy Policy]
      summary: Get the privacy notice in force (V-02)
      description: Returns the newest notice that has not been soft deleted. The notice is a PDF and documentUrl is a public link to it. policyId and version must be sent back when the user accepts.
      responses:
        '200':
          description: Notice in force retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacyPolicySuccessResponse'
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/privacy-policy/consent:
    get:
      tags: [Privacy Policy]
      summary: Check whether a user accepted the notice in force (V-02)
      description: Used on start-up to decide whether the privacy screen must be shown. The user is taken from the token. It answers against the notice currently in force so publishing a new version makes every user consent again.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Consent status retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentStatusSuccessResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [Privacy Policy]
      summary: Record that a user accepted the notice (V-02)
      description: The user is taken from the token. The server sets the version, the timestamp, the client IP, and is_accepted. Calling it again for the same user and notice returns the existing consent instead of creating a duplicate.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterConsentRequest'
            example:
              policyId: ee5d5ef6-e18c-4d20-81cc-6fb4106bff48
      responses:
        '201':
          description: Consent recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterConsentSuccessResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/countries-states:
    get:
      tags: [Locations]
      summary: List countries and their states
      description: Returns active countries with their active states, both ordered by Spanish name. Used to fill country and state dropdowns.
      responses:
        '200':
          description: Countries and states retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountriesWithStatesSuccessResponse'
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/reports/export:
    get:
      tags: [Reports]
      summary: Export a report as CSV
      description: Returns a CSV report for the requested date range. This endpoint is restricted to authenticated administrators.
      security:
        - BearerAuth: []
      parameters:
        - name: start-date
          in: query
          required: true
          description: Inclusive start date of the report range.
          schema:
            type: string
            format: date
            example: '2026-01-01'
        - name: end-date
          in: query
          required: true
          description: Inclusive end date of the report range. The range cannot exceed one year and cannot precede start-date.
          schema:
            type: string
            format: date
            example: '2026-05-01'
      responses:
        '200':
          description: CSV report generated successfully.
          headers:
            Content-Disposition:
              description: Download filename for the generated CSV.
              schema:
                type: string
                example: attachment; filename="report-2026-01-01-2026-05-01.csv"
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      description: User UUID
      schema: { type: string, format: uuid }
    CaseId:
      name: caseId
      in: path
      required: true
      description: Case UUID
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      description: One-based page number.
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      description: Number of cases per page.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Search:
      name: search
      in: query
      description: Case ID or user name search text.
      schema: { type: string, default: '' }
    Urgency:
      name: urgency
      in: query
      description: Urgency filter. Empty and Todas return all urgency levels.
      schema:
        type: string
        enum: ['', Todas, Alta, Media, Baja, Sin evaluar]
        default: ''
  
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer 
      bearerFormat: JWT
      description: Token returned by /api/auth/login. It expires after 120 hours

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing, invalid or expired token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: The caller does not have permission to access this resource.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    ServerStatusResponse:
      type: object
      required: [status]
      properties: { status: { type: string } }

    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, example: false }
        error: { type: string }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    LoginData:
      type: object
      required: [token, user_id]
      properties:
        token: { type: string }
        user_id: { type: string, format: uuid }

    LoginSuccessResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/LoginData' }

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password, confirm_password]
      properties:
        current_password: { type: string, format: password }
        new_password: { type: string, format: password, minLength: 8 }
        confirm_password: { type: string, format: password, minLength: 8 }

    ChangePasswordSuccessResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [message]
          properties:
            message: { type: string, example: Password updated successfully. }

    AssetLink:
      type: object
      properties:
        relation:
          type: array
          items: { type: string, example: delegate_permission/common.handle_all_urls }
        target:
          type: object
          properties:
            namespace: { type: string, example: android_app }
            package_name: { type: string, example: com.example.adaxintegra }
            sha256_cert_fingerprints:
              type: array
              items: { type: string }

    MessageSuccessResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          required: [message]
          properties:
            message: { type: string }

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token: { type: string, description: Recovery token received by email. }
        newPassword: { type: string, format: password, minLength: 8 }

    UserProfile:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        birth_date: { type: string, format: date, nullable: true }
        phone: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    UserProfileSuccessResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/UserProfile' }

    Profile:
      type: object
      nullable: true
      properties:
        name: { type: string }
        last_name: { type: string }
        birth_date: { type: string, format: date }
        phone: { type: string }

    Address:
      type: object
      nullable: true
      properties:
        address_line_1: { type: string }
        address_line_2: { type: string, nullable: true }
        neighborhood: { type: string }
        zip_code: { type: string }
        country: { type: string }
        state: { type: string }
        city: { type: string }

    Documents:
      type: object
      nullable: true
      properties:
        document_id: { type: string, format: uuid }
        identity_document_url:
          type: string
          format: uri
          nullable: true
          description: Signed URL that expires after 15 minutes.
        proof_of_address_url:
          type: string
          format: uri
          nullable: true
          description: Signed URL that expires after 15 minutes.

    PreSubmissionData:
      type: object
      required: [user_id, profile, address, documents]
      properties:
        user_id: { type: string, format: uuid }
        profile: { $ref: '#/components/schemas/Profile' }
        address: { $ref: '#/components/schemas/Address' }
        documents: { $ref: '#/components/schemas/Documents' }

    PreSubmissionSuccessResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/PreSubmissionData' }

    ProfileUpdate:
      type: object
      properties:
        name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        birth_date: { type: string, format: date }
        phone: { type: string }

    AddressUpdate:
      type: object
      properties:
        address_line_1: { type: string }
        address_line_2: { type: string, nullable: true }
        neighborhood: { type: string }
        zip_code: { type: string }
        country: { type: string }
        state: { type: string }
        city: { type: string }

    DocumentsUpdate:
      type: object
      properties:
        identity_document:
          type: string
          description: Storage path that starts with "{userId}/", has no empty, ".", or ".." segments, and already exists in storage.
        proof_of_address:
          type: string
          description: Storage path that starts with "{userId}/", has no empty, ".", or ".." segments, and already exists in storage.

    PreSubmissionUpdateRequest:
      type: object
      minProperties: 1
      properties:
        profile: { $ref: '#/components/schemas/ProfileUpdate' }
        address: { $ref: '#/components/schemas/AddressUpdate' }
        documents: { $ref: '#/components/schemas/DocumentsUpdate' }

    PreSubmissionMultipartRequest:
      type: object
      minProperties: 1
      properties:
        profile:
          type: string
          description: JSON string of ProfileUpdate.
          example: '{"name":"Ana","phone":"5512345678"}'
        address:
          type: string
          description: JSON string of AddressUpdate.
          example: '{"city":"Monterrey"}'
        identity_document:
          type: string
          format: binary
          description: PDF, JPEG or PNG, max 5 MB.
        proof_of_address:
          type: string
          format: binary
          description: PDF, JPEG or PNG, max 5 MB.

    CreateAccountRequest:
      type: object
      required: [name, last_name, email, password, confirm_password]
      properties:
        name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        confirm_password: { type: string, format: password, minLength: 8 }

    CreateAccountData:
      type: object
      required: [userId, name, lastName, email]
      properties:
        userId: { type: string, format: uuid }
        name: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }

    CreateAccountSuccessResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/CreateAccountData' }

    RegisterExternalUserProfile:
      type: object
      required: [name, last_name, email]
      properties:
        name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        birth_date: { type: string, format: date }
        phone: { type: string }

    RegisterExternalUserAddress:
      type: object
      required: [address_line_1, neighborhood, zip_code, country, state, city]
      properties:
        address_line_1: { type: string }
        address_line_2: { type: string, nullable: true }
        neighborhood: { type: string }
        zip_code: { type: string }
        country: { type: string }
        state: { type: string }
        city: { type: string }

    RegisterExternalUserRequest:
      type: object
      required: [profile, address]
      properties:
        profile: { $ref: '#/components/schemas/RegisterExternalUserProfile' }
        address: { $ref: '#/components/schemas/RegisterExternalUserAddress' }

    RegisterExternalUserData:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        birth_date: { type: string, format: date, nullable: true }
        phone: { type: string, nullable: true }
        record_id: { type: string, format: uuid }
        record_number: { type: string, example: EXP-2026-0001, nullable: true }
        address_id: { type: string, format: uuid }

    RegisterExternalUserSuccessResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/RegisterExternalUserData' }
    
    ExternalProfile:
      type: object
      nullable: true
      properties:
        name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        birth_date: { type: string, format: date, nullable: true }
        phone: { type: string, nullable: true }

    ExternalProfileData:
      type: object
      required: [user_id, profile, address]
      properties:
        user_id: { type: string, format: uuid }
        profile: { $ref: '#/components/schemas/ExternalProfile' }
        address: { $ref: '#/components/schemas/Address' }
    
    ExternalProfileSuccessResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/ExternalProfileData' }
    
    ExternalProfileUpdateRequest:
      type: object
      required: [reason, consentConfirmed]
      description: At least one profile or address field is required. name, last_name and birth_date are rejected.
      properties:
        profile:
          type: object
          properties:
            email: { type: string, format: email }
            phone:
              type: string
              description: Country code followed by 10 digits, for example +524424567890.
        address: { $ref: '#/components/schemas/AddressUpdate' }
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: Why the data is being changed. Stored in the activity log.
        consentConfirmed:
          type: boolean
          enum: [true]
          description: The admin confirms the external user agreed to the change. Must be true.

    ExternalProfileErrorResponse:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, example: false }
        error: { type: string }
        errors:
          type: object
          nullable: true
          additionalProperties: { type: string }
          description: Reason for each invalid body field

    RecordListItem:
      type: object
      properties:
        record_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        name: { type: string, example: Daniela Alejandra Herrera Ocampo }
        record_number: { type: string, nullable: true, example: EXP-2026-0001 }
        status:
          type: string
          enum: [SIN_EMPEZAR, EN_REVISION, EN_SEGUIMIENTO, COMPLETADO]
          example: SIN_EMPEZAR
        active_cases_count: { type: integer, example: 2 }
        updated_at: { type: string, format: date-time, nullable: true }

    RecordListSuccessResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            records:
              type: array
              items: { $ref: '#/components/schemas/RecordListItem' }
            total: { type: integer, example: 42 }
            page: { type: integer, example: 1 }
            limit: { type: integer, example: 10 }

    CaseListItem:
      type: object
      properties:
        case_id: { type: string, format: uuid }
        name: { type: string }
        violence_types:
          type: array
          items: { type: string }
        state: { type: string, nullable: true }
        severity: { type: integer, nullable: true, minimum: 1, maximum: 10 }
        urgency: { type: string, enum: [Alta, Media, Baja, Sin evaluar] }
        updated_at: { type: string, format: date-time, nullable: true }

    CaseListData:
      type: object
      required: [cases, total, page, limit]
      properties:
        cases:
          type: array
          items: { $ref: '#/components/schemas/CaseListItem' }
        total: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 100 }

    CaseListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/CaseListData' }

    CaseSummary:
      type: object
      required: [caseId, caseNumber, state, userName, violenceTypes, assignedUsers, updatedAt]
      properties:
        caseId: { type: string, format: uuid, nullable: true }
        caseNumber: { type: string, nullable: true, example: C-26-9999 }
        state: { type: string, nullable: true, example: Open }
        userName:
          type: string
          nullable: true
          example: Maria Gomez
          description: Full name of the case owner.
        violenceTypes:
          type: array
          items: { type: string }
          description: Unique, non-deleted violence types.
        assignedUsers:
          type: array
          description: Internal users assigned to the case.
          items:
            type: object
            properties:
              userId: { type: string, format: uuid }
              name: { type: string, example: Mariana Robles Ortega }
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: UTC timestamp.

    CaseSummaryListResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/CaseSummary' }

    CreateCaseRequest:
      type: object
      required: [writtenDescription, writtenHelpsWanted, hasExternalSupport]
      properties:
        writtenDescription:
          type: string
          minLength: 1
          maxLength: 5000
          description: Case description. Cannot be black.
        writtenHelpsWanted:
          type: string
          minLength: 1
          maxLength: 400
          description: Help the user expects to recieve, as free tet. Cannot be blank.
        hasExternalSupport:
          type: boolean
          description: Whether the user has external support (Yes/No in the app). Must be a JSON boolean
      
    CreateCaseData:
      type: object
      properties:
        caseId: {type: string, format: uuid}
        state: {type: string, example: Open}
        createdAt: {type: string, format: date-time}
        writtenDescription: {type: string}
        writtenHelpsWanted: {type: string}
        hasLawyer:
          type: boolean
          description: Same value sent as hasExternalSupport.
        helps:
          type: array
          items: {type: string}
          description: Always empty.

    CreateCaseSuccessResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean, example: true}
        data: { $ref: '#/components/schemas/CreateCaseData'}

    CreateCaseErrorResponse:
      type: object
      required: [success, error]
      properties:
        success: {type: boolean, example: false}
        error: {type: string}
        errors:
          type: object
          nullable: true
          additionalProperties: {type: string}
          description: Reason for each invalid body field

    CloseCaseData:
      type: object
      required: [caseId, state, updatedAt]
      properties:
        caseId: { type: string, format: uuid }
        state: { type: string, example: Closed }
        updatedAt: { type: string, format: date-time, nullable: true }

    CloseCaseSuccessResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/CloseCaseData' }

    CaseDetail:
      type: object
      properties:
        case_id: { type: string, format: uuid }
        case_number: { type: string, nullable: true }
        written_description: { type: string, nullable: true }
        written_helps_wanted: { type: string, nullable: true }
        has_lawyer: { type: boolean }
        state: { type: string, nullable: true }
        record_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }
        record:
          type: object
          properties:
            record_id: { type: string, format: uuid }
            user:
              type: object
              properties:
                user_id: { type: string, format: uuid }
                name: { type: string }
                last_name: { type: string }
        case_steps:
          type: array
          items:
            type: object
            properties:
              case_step_id: { type: string, format: uuid }
              step_number: { type: integer }
              status: { type: string }
        case_violence:
          type: array
          items:
            type: object
            properties:
              violence_types:
                type: object
                properties:
                  violence_id: { type: string, format: uuid }
                  description: { type: string }
                  severity: { type: integer, nullable: true }
        case_help:
          type: array
          items:
            type: object
            properties:
              help_types:
                type: object
                properties:
                  help_id: { type: string, format: uuid }
                  description: { type: string }

    StateOption:
      type: object
      properties:
        state_id: { type: string }
        name_en: { type: string }
        name_es: { type: string }
        code: { type: string, nullable: true }

    CountryWithStates:
      type: object
      properties:
        country_id: { type: string }
        iso2: { type: string, example: MX }
        name_en: { type: string }
        name_es: { type: string }
        phone_code: { type: string, nullable: true }
        states:
          type: array
          items: { $ref: '#/components/schemas/StateOption' }

    CountriesWithStatesSuccessResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/CountryWithStates' }

    CaseDetailResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/CaseDetail' }

    PrivacyPolicyData:
      type: object
      required: [policyId, version, documentUrl]
      properties:
        policyId: { type: string, format: uuid }
        version: { type: string, example: '1.0.0' }
        documentUrl:
          type: string
          format: uri
          nullable: true
          description: Public link to the notice PDF in Storage.

    PrivacyPolicySuccessResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/PrivacyPolicyData' }

    ConsentStatusData:
      type: object
      required: [hasAccepted, policyId, version, acceptedAt]
      properties:
        hasAccepted: { type: boolean, description: Whether the user accepted the notice in force. }
        policyId: { type: string, format: uuid }
        version: { type: string, example: '1.0.0' }
        acceptedAt:
          type: string
          format: date-time
          nullable: true
          description: UTC. Null when the user has not accepted yet.

    ConsentStatusSuccessResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/ConsentStatusData' }

    RegisterConsentRequest:
      type: object
      required: [policyId]
      properties:
        policyId: { type: string, format: uuid, description: The notice that was shown to the user. }

    ConsentData:
      type: object
      required: [consentId, version, acceptedAt]
      properties:
        consentId: { type: string, format: uuid }
        version: { type: string, example: '1.0.0' }
        acceptedAt: { type: string, format: date-time, description: UTC timestamp generated by the database. }

    RegisterConsentSuccessResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/ConsentData' }

    CreateCollaboratorRequest:
      type: object
      required: [name, last_name, email, password, phone]
      properties:
          name: { type: string, maxLength: 50 }
          last_name: { type: string, maxLength: 50 }
          email: { type: string, format: email, maxLength: 128 }
          password: { type: string, format: password, minLength: 8, maxLength: 128 }
          phone: { type: string, example: '+524421513555', description: Country code with + followed by 10 digits }

    CollaboratorData:
      type: object
      required: [user_id, name, last_name, email, phone, role]
      properties:
        user_id: { type: string, format: uuid }
        name: { type: string }
        last_name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        role: { type: string, example: internal }

    CreateCollaboratorSuccessResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data: { $ref: '#/components/schemas/CollaboratorData' }

    CreateCollaboratorErrorResponse:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, example: false }
        error: { type: string }
        errors:
          type: object
          nullable: true
          additionalProperties: { type: string }
          example: { email: An account with this email already exists. }

    ActivityLogItem:
      type: object
      required: [log_id, actor_name, action, action_label, target, description, reason, created_at]
      properties:
        log_id: { type: string, format: uuid }
        actor_name: { type: string, example: Mariana Robles Ortega }
        action: { type: string, example: update_external_profile }
        action_label: { type: string, example: Edición de datos de usuaria }
        entity: { type: string, nullable: true, example: user }
        entity_id: { type: string, format: uuid, nullable: true }
        target: { type: string, example: Valeria Prueba Hora }
        description: { type: string, example: Mariana Robles Ortega editó los datos de Valeria Prueba Hora }
        reason: { type: string, example: Corrección del teléfono }
        created_at: { type: string, format: date-time }

    ActivityLogSuccessResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, example: true }
        data:
          type: object
          properties:
            logs:
              type: array
              items: { $ref: '#/components/schemas/ActivityLogItem' }
            total: { type: integer, example: 2 }
            page: { type: integer, example: 1 }
            limit: { type: integer, example: 10 }

    ActivityLogErrorResponse:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, example: false }
        error: { type: string }
        errors:
          type: object
          nullable: true
          additionalProperties: { type: string }
          example: { to: to must be later than from. }
